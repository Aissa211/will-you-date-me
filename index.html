<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go On A Date With Me? 💕</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ffb6c1 0%, #ff8fab 45%, #ff5c8a 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .floating-heart {
    position: absolute;
    font-size: 24px;
    opacity: 0.5;
    animation: floatUp 6s linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 28px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 5;
    animation: pop 0.6s ease-out;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .emoji-top {
    font-size: 60px;
    margin-bottom: 10px;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    color: #d6336c;
    font-size: 1.7em;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  p.sub {
    color: #888;
    font-size: 0.95em;
    margin-bottom: 30px;
  }

  .buttons {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 20px;
    height: 60px;
  }

  button {
    padding: 14px 32px;
    font-size: 1.1em;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff5c8a, #ff8fab);
    color: white;
    box-shadow: 0 8px 20px rgba(255,92,138,0.4);
  }

  #yesBtn:hover {
    transform: scale(1.08);
  }

  #noBtn {
    background: #f1f1f1;
    color: #888;
    position: relative;
    transition: none;
  }

  #noBtn.dodging {
    position: fixed;
  }

  .success {
    display: none;
  }

  .success.show {
    display: block;
  }

  .card.hidden-content > *:not(.success) {
    display: none;
  }

  .success h1 {
    font-size: 2em;
  }

  .success .emoji-top {
    font-size: 80px;
  }

  .heart-burst {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    animation: burst 1.4s ease-out forwards;
    z-index: 999;
  }

  @keyframes burst {
    0% { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <div class="emoji-top">💌</div>
    <h1>Will you go on a date with me?</h1>
    <p class="sub">Just answer honestly... (there's only one honest answer 😏)</p>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button id="noBtn">No</button>
    </div>

    <div class="success" id="success">
      <div class="emoji-top">🥰💕</div>
      <h1>Yay! It's a date! 💘</h1>
      <p class="sub" style="margin-top:14px;">You just made me the happiest person alive.<br>Get ready for the best date ever. ✨</p>
    </div>
  </div>

<script>
  const FORMSPREE_URL = "https://formspree.io/f/mjyvbwzo";

  function sendEmail(message) {
    fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ message: message, time: new Date().toLocaleString() })
    }).catch(() => {});
  }

  // Notification quand la page est ouverte
  sendEmail("💌 She opened the date page!");

  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const card = document.getElementById('card');
  const success = document.getElementById('success');

  function moveNoButton() {
    noBtn.classList.add('dodging');
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;
    const newX = Math.max(20, Math.random() * maxX);
    const newY = Math.max(20, Math.random() * maxY);
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('click', moveNoButton);
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveNoButton();
  });

  function sayYes() {
    sendEmail("💖 She said YES to the date!!");
    card.classList.add('hidden-content');
    success.classList.add('show');
    launchHearts();
  }

  function launchHearts() {
    const hearts = ['💖','💕','💗','💘','💓','❤️'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart-burst';
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = '50%';
        h.style.top = '50%';
        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 250;
        h.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        h.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1400);
      }, i * 60);
    }
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      h.textContent = ['💖','💕','💗','❤️'][Math.floor(Math.random()*4)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (4 + Math.random()*3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }, 300);
  }

  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'floating-heart';
    h.textContent = ['💗','💕','💓'][Math.floor(Math.random()*3)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (5 + Math.random()*4) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 800);
</script>

</body>
</html>
